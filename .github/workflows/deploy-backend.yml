name: Deploy Backend to Azure VM

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'demo/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest

    steps:
      - name: Execute SSH Commands on Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          port: 22
          script: |
            echo "🚀 Pulling latest code on Azure VM..."
            cd /home/azureuser/Dual-Domain-Brain-Tumor-Segmentation
            git pull
            echo "🔄 Restarting FastAPI service..."
            sudo systemctl restart brain-tumor-api
            echo "✅ Deployment complete! Checking health..."
            curl -s http://localhost:8000/api/health
            sudo systemctl status brain-tumor-api --no-pager